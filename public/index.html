<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>your life as a multiplayer game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Canvas World -->
  <canvas id="world"></canvas>

  <!-- Vignette overlay -->
  <div id="vignette"></div>

  <!-- Floating ambient particles (CSS only) -->
  <div id="particles"></div>

  <!-- HUD: player name + mood -->
  <div id="hud">
    <div id="hud-name"></div>
    <div id="hud-coords"></div>
  </div>

  <!-- Live player count -->
  <div id="presence">
    <span id="presence-dot"></span>
    <span id="presence-count">1</span> <span id="presence-label">drifting</span>
  </div>

  <!-- Global mood indicator -->
  <div id="mood-strip">
    <div id="mood-label">collective mood</div>
    <div id="mood-value">neutral</div>
  </div>

  <!-- Mood selector (bottom) -->
  <div id="mood-picker">
    <span class="mood-opt" data-mood="ecstatic">ecstatic</span>
    <span class="mood-opt" data-mood="happy">happy</span>
    <span class="mood-opt active" data-mood="neutral">neutral</span>
    <span class="mood-opt" data-mood="melancholy">melancholy</span>
    <span class="mood-opt" data-mood="lost">lost</span>
  </div>

  <!-- Memory input -->
  <div id="memory-overlay" class="hidden">
    <div id="memory-box">
      <div id="memory-prompt">leave something behind.</div>
      <textarea id="memory-input" maxlength="100" placeholder="a thought, a feeling, a fragment…" spellcheck="false"></textarea>
      <div id="memory-meta">
        <span id="memory-chars">100</span>
        <button id="memory-submit">release</button>
      </div>
      <div id="memory-close">esc to close</div>
    </div>
  </div>

  <!-- Orb reading popup -->
  <div id="orb-popup" class="hidden">
    <div id="orb-text"></div>
    <div id="orb-ago"></div>
  </div>

  <!-- Keybind hints (fade after 8s) -->
  <div id="hints">
    <div class="hint"><kbd>WASD</kbd> / <kbd>↑↓←→</kbd> move</div>
    <div class="hint"><kbd>E</kbd> leave a memory</div>
    <div class="hint">walk near <span class="orb-hint">orbs</span> to read</div>
  </div>

  <!-- Avatar customize screen -->
  <div id="customize-screen" class="hidden">
    <div id="customize-box">
      <div id="customize-title">who are you<em>?</em></div>
      <div id="customize-sub">or let the universe decide.</div>
      <div class="customize-field">
        <label>your name</label>
        <input type="text" id="custom-name" maxlength="20" placeholder="leave blank for a random name" spellcheck="false" autocomplete="off">
      </div>
      <div class="customize-field">
        <label>your color</label>
        <div id="color-options">
          <div class="color-opt" data-color="#ff6b9d" style="background:#ff6b9d"></div>
          <div class="color-opt" data-color="#c084fc" style="background:#c084fc"></div>
          <div class="color-opt selected" data-color="#60a5fa" style="background:#60a5fa"></div>
          <div class="color-opt" data-color="#34d399" style="background:#34d399"></div>
          <div class="color-opt" data-color="#fbbf24" style="background:#fbbf24"></div>
          <div class="color-opt" data-color="#f87171" style="background:#f87171"></div>
          <div class="color-opt" data-color="#a78bfa" style="background:#a78bfa"></div>
          <div class="color-opt" data-color="#fb923c" style="background:#fb923c"></div>
        </div>
      </div>
      <div id="avatar-preview">
        <canvas id="preview-canvas" width="60" height="60"></canvas>
      </div>
      <button id="customize-enter">enter the world</button>
    </div>
  </div>

  <!-- Mute button -->
  <div id="mute-btn" title="toggle sound">♪</div>

  <!-- Intro splash -->
  <div id="splash">
    <div id="splash-inner">
      <div id="splash-title">your life<br><em>as a multiplayer game</em></div>
      <div id="splash-sub">you are not alone in here.</div>
      <div id="splash-enter">click anywhere to enter</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/game.js"></script>
</body>
</html>
